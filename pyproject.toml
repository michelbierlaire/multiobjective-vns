[project]
name = "multiobjective-vns"
version = "0.1.0"
description = "Variable Neighborhood Search for Multiobjective Optimization"
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[project.scripts]
multiobjective-vns-view = 'multiobjective_vns.pareto_viewer.app:main'

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "sphinx>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
show_error_codes = true
pretty = true
